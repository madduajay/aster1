[project]
name = "aster1-personal-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "websockets", "deepagents", "langgraph-checkpoint-sqlite", "langchain-openai", "openai", "playwright", "argon2-cffi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
