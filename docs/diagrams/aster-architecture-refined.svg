<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1590" viewBox="0 0 2200 1590" role="img" aria-labelledby="title desc">
<title id="title">Aster — agent harness architecture</title><desc id="desc">Deep Agent Harness coordinates intent, context assembly, planning, tool calling, subagents and verification. Memory is separated into short-term, long-term and proposed episodic recall. Browser actions have approval and verification boundaries. Independent Dining and Travel services use Company MCP. Temporal schedules and workflows handle explicit monitors, durable waits, callbacks and delivery.</desc>
