<svg xmlns="http://www.w3.org/2000/svg" width="2640" height="2640" viewBox="-100 0 2640 2640" role="img" aria-labelledby="title desc">
<title id="title">Aster — request execution sequence</title>
<desc id="desc">Aster loads scoped context, resolves intent, invokes relevant tools or independent subagents, verifies and streams results, saves eligible memory, and optionally uses Temporal for durable availability workflows. Browser transactions require approval. Signed MCP callbacks reach subagents before Temporal signals.</desc>
